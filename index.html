<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AssetPulse Pro - 자산 관리</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans KR', sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .card { background: #111827; border: 1px solid #1f2937; border-radius: 12px; }
    .hidden { display: none !important; }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <header class="sticky top-0 z-20 border-b border-slate-800 bg-slate-900/95 p-4">
    <div class="mx-auto flex max-w-6xl items-center justify-between">
      <div class="font-extrabold tracking-wide text-emerald-400">ASSETPULSE PRO</div>
      <button id="syncButton" class="rounded-lg bg-emerald-600 px-4 py-2 text-sm font-bold hover:bg-emerald-500">
        토스 잔고 동기화
      </button>
    </div>
  </header>

  <main class="mx-auto max-w-6xl space-y-4 p-4">
    <section class="card flex flex-wrap items-end justify-between gap-4 p-5">
      <div>
        <div class="text-sm font-bold text-emerald-400">실시간 총자산</div>
        <div id="totalKrw" class="mono mt-1 text-3xl font-bold">₩ 0</div>
        <div id="syncStatus" class="mt-2 text-xs text-slate-400">토스 잔고 동기화 대기 중</div>
      </div>
      <div class="text-sm text-slate-400">
        기준 환율: <span id="fxRate" class="mono text-emerald-400">-</span>원
      </div>
    </section>

    <nav class="flex gap-2 border-b border-slate-800 pb-2 text-sm">
      <button class="tab rounded px-4 py-2 text-emerald-400" data-tab="portfolio">포트폴리오</button>
      <button class="tab rounded px-4 py-2 text-slate-400" data-tab="history">자산 기록</button>
    </nav>

    <section id="portfolioView" class="grid gap-4 lg:grid-cols-3">
      <div class="card overflow-auto lg:col-span-2">
        <div class="border-b border-slate-800 p-4 font-bold">보유 종목</div>
        <table class="w-full text-left text-xs">
          <thead class="bg-slate-900 text-slate-400">
            <tr>
              <th class="p-3">종목</th>
              <th class="p-3 text-right">수량</th>
              <th class="p-3 text-right">현재가</th>
              <th class="p-3 text-right">평가액 (원)</th>
              <th class="p-3 text-right">수익률</th>
            </tr>
          </thead>
          <tbody id="holdingsBody">
            <tr><td colspan="5" class="p-8 text-center text-slate-500">토스 잔고를 동기화해주세요.</td></tr>
          </tbody>
        </table>
      </div>
      <div class="card p-4">
        <h2 class="mb-3 font-bold">자산 배분</h2>
        <div class="h-72"><canvas id="allocationChart"></canvas></div>
      </div>
    </section>

    <section id="historyView" class="card hidden space-y-4 p-4">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <h2 class="font-bold">자산 추이 기록</h2>
        <div class="flex flex-wrap gap-2">
          <input id="startDate" type="date" class="rounded border border-slate-700 bg-slate-900 p-2 text-xs">
          <input id="endDate" type="date" class="rounded border border-slate-700 bg-slate-900 p-2 text-xs">
          <button id="filterButton" class="rounded bg-slate-700 px-3 py-2 text-xs">기간 적용</button>
          <button id="saveButton" class="rounded bg-emerald-600 px-3 py-2 text-xs font-bold">오늘 스냅샷 저장</button>
          <button id="reloadButton" class="rounded bg-slate-700 px-3 py-2 text-xs">새로고침</button>
        </div>
      </div>
      <div class="h-80"><canvas id="historyChart"></canvas></div>
    </section>
  </main>

  <div id="newsModal" class="fixed inset-0 z-30 hidden items-center justify-center bg-black/70 p-4">
    <div class="card max-h-[85vh] w-full max-w-lg overflow-auto p-5">
      <div class="mb-4 flex items-center justify-between">
        <h2 id="newsHeading" class="font-bold text-emerald-400">종목 뉴스</h2>
        <button id="closeNews" class="rounded bg-slate-800 px-3 py-1">닫기</button>
      </div>
      <div id="newsContent" class="space-y-3 text-sm"></div>
    </div>
  </div>

  <script>
    const API_BASE_URL = 'https://auto-stock-server-vxye.onrender.com';

    let holdings = [];
    let historyData = [];
    let fxRate = 1384.5;
    let currentTotalKrw = 0;
    let allocationChart = null;
    let historyChart = null;

    const won = value =>
      `₩ ${Math.round(Number(value) || 0).toLocaleString('ko-KR')}`;

    function localDateString(date = new Date()) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    async function loadFxRate() {
      try {
        const response = await fetch('https://open.er-api.com/v6/latest/USD');
        if (!response.ok) throw new Error('환율 조회 실패');
        const data = await response.json();
        if (Number.isFinite(data?.rates?.KRW)) {
          fxRate = data.rates.KRW;
          document.getElementById('fxRate').textContent =
            fxRate.toLocaleString('ko-KR', { maximumFractionDigits: 2 });
          renderPortfolio();
        }
      } catch (error) {
        console.error(error);
      }
    }

    function getHoldingsArray(data) {
      if (Array.isArray(data)) return data;
      if (Array.isArray(data?.items)) return data.items;
      if (Array.isArray(data?.holdings)) return data.holdings;
      return [];
    }

    async function syncToss() {
      const button = document.getElementById('syncButton');
      const status = document.getElementById('syncStatus');
      button.disabled = true;
      button.textContent = '불러오는 중...';
      status.textContent = '토스 서버에 연결 중입니다.';

      try {
        const response = await fetch(`${API_BASE_URL}/api/sync-toss`);
        const result = await response.json();
        if (!response.ok || !result.success) {
          throw new Error(result.message || '토스 잔고 조회에 실패했습니다.');
        }

        holdings = getHoldingsArray(result.data);
        renderPortfolio();
        status.textContent = `동기화 완료 · ${new Date().toLocaleString('ko-KR')}`;
      } catch (error) {
        console.error(error);
        status.textContent = `동기화 실패: ${error.message}`;
      } finally {
        button.disabled = false;
        button.textContent = '토스 잔고 동기화';
      }
    }

    function renderPortfolio() {
      const body = document.getElementById('holdingsBody');
      body.replaceChildren();

      const labels = [];
      const values = [];
      const colors = [
        '#10b981', '#3b82f6', '#f59e0b', '#8b5cf6',
        '#ec4899', '#06b6d4', '#eab308', '#f97316'
      ];

      currentTotalKrw = 0;

      if (!holdings.length) {
        const row = document.createElement('tr');
        const cell = document.createElement('td');
        cell.colSpan = 5;
        cell.className = 'p-8 text-center text-slate-500';
        cell.textContent = '표시할 보유 종목이 없습니다.';
        row.appendChild(cell);
        body.appendChild(row);
      }

      holdings.forEach((item, index) => {
        const name = String(item.name || item.stockName || '이름 없음');
        const ticker = String(item.symbol || item.ticker || item.code || '-');
        const currency = String(item.currency || 'KRW').toUpperCase();
        const quantity = Number(item.quantity || item.holdingQuantity || 0);
        const price = Number(item.lastPrice || item.currentPrice || 0);
        const profitRate = Number(item.profitLoss?.rate || 0) * 100;
        const valueKrw = quantity * price * (currency === 'USD' ? fxRate : 1);

        currentTotalKrw += valueKrw;
        labels.push(name);
        values.push(valueKrw);

        const row = document.createElement('tr');
        row.className = 'cursor-pointer border-t border-slate-800 hover:bg-slate-900';
        row.addEventListener('click', () => showNews(name, ticker));

        const cells = [
          `${name} (${ticker})`,
          quantity.toLocaleString('ko-KR'),
          `${currency === 'USD' ? '$' : '₩'} ${price.toLocaleString('ko-KR')}`,
          won(valueKrw),
          `${profitRate >= 0 ? '+' : ''}${profitRate.toFixed(2)}%`
        ];

        cells.forEach((text, cellIndex) => {
          const cell = document.createElement('td');
          cell.className = `p-3 ${cellIndex > 0 ? 'text-right mono' : ''}`;
          cell.textContent = text;
          row.appendChild(cell);
        });

        body.appendChild(row);
      });

      document.getElementById('totalKrw').textContent = won(currentTotalKrw);

      if (allocationChart) allocationChart.destroy();
      allocationChart = new Chart(document.getElementById('allocationChart'), {
        type: 'doughnut',
        data: {
          labels,
          datasets: [{
            data: values,
            backgroundColor: values.map((_, index) => colors[index % colors.length]),
            borderWidth: 0
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { position: 'bottom', labels: { color: '#cbd5e1' } } }
        }
      });
    }

    async function loadHistory() {
      try {
        const response = await fetch(`${API_BASE_URL}/api/history`);
        const result = await response.json();
        if (!response.ok || !result.success || !Array.isArray(result.data)) {
          throw new Error(result.message || '기록 조회에 실패했습니다.');
        }
        historyData = result.data;
        renderHistory();
      } catch (error) {
        console.error(error);
        historyData = [];
        renderHistory();
        alert(`기록을 불러오지 못했습니다: ${error.message}`);
      }
    }

    function renderHistory() {
      const start = document.getElementById('startDate').value;
      const end = document.getElementById('endDate').value;

      const filtered = historyData
        .filter(item => (!start || item.date >= start) && (!end || item.date <= end))
        .sort((a, b) => a.date.localeCompare(b.date));

      if (historyChart) historyChart.destroy();

      historyChart = new Chart(document.getElementById('historyChart'), {
        type: 'line',
        data: {
          labels: filtered.map(item => item.date),
          datasets: [{
            label: '총자산 (원)',
            data: filtered.map(item => Number(item.totalKrw) || 0),
            borderColor: '#10b981',
            backgroundColor: 'rgba(16, 185, 129, 0.15)',
            fill: true,
            tension: 0.25
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { labels: { color: '#cbd5e1' } } },
          scales: {
            x: { ticks: { color: '#94a3b8' }, grid: { color: '#1f2937' } },
            y: {
              ticks: {
                color: '#94a3b8',
                callback: value => Number(value).toLocaleString('ko-KR')
              },
              grid: { color: '#1f2937' }
            }
          }
        }
      });
    }

    async function saveSnapshot() {
      if (currentTotalKrw <= 0) {
        alert('먼저 토스 잔고를 동기화해주세요.');
        return;
      }

      try {
        const response = await fetch(`${API_BASE_URL}/api/history`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            date: localDateString(),
            totalKrw: currentTotalKrw
          })
        });

        const result = await response.json();
        if (!response.ok || !result.success) {
          throw new Error(result.message || '저장에 실패했습니다.');
        }

        await loadHistory();
        alert('오늘 자산 기록을 저장했습니다.');
      } catch (error) {
        console.error(error);
        alert(`저장에 실패했습니다: ${error.message}`);
      }
    }

    function showNews(name, ticker) {
      document.getElementById('newsHeading').textContent = `${name} (${ticker}) 뉴스`;
      document.getElementById('newsContent').textContent = '뉴스를 불러오는 중...';

      const modal = document.getElementById('newsModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');

      fetch(`${API_BASE_URL}/api/news?q=${encodeURIComponent(`${name} OR ${ticker}`)}`)
        .then(async response => {
          const result = await response.json();
          if (!response.ok || !result.success) {
            throw new Error(result.message || '뉴스 조회 실패');
          }
          return result.articles || [];
        })
        .then(articles => {
          const container = document.getElementById('newsContent');
          container.replaceChildren();

          const unique = new Set();
          const found = articles.filter(item => {
            const url = item.article?.url;
            if (!url || unique.has(url)) return false;
            unique.add(url);
            return true;
          });

          if (!found.length) {
            container.textContent = '관련 뉴스를 찾을 수 없습니다.';
            return;
          }

          found.forEach(item => {
            const article = item.article;
            const card = document.createElement('article');
            card.className = 'rounded-lg border border-slate-700 bg-slate-900 p-3';

            const label = document.createElement('div');
            label.className = 'mb-2 text-xs font-bold text-emerald-400';
            label.textContent = item.label;

            const title = document.createElement('a');
            title.className = 'font-bold hover:text-emerald-400';
            title.textContent = article.title || '제목 없음';
            title.target = '_blank';
            title.rel = 'noopener noreferrer';

            try {
              const url = new URL(article.url);
              if (url.protocol === 'https:') title.href = url.href;
            } catch (_) {
              title.removeAttribute('href');
            }

            const summary = document.createElement('p');
            summary.className = 'mt-2 text-xs leading-relaxed text-slate-300';
            summary.textContent = article.description || '기사 요약이 없습니다.';

            const source = document.createElement('div');
            source.className = 'mt-2 text-right text-[10px] text-slate-500';
            source.textContent = `출처: ${article.source?.name || '알 수 없음'}`;

            card.append(label, title, summary, source);
            container.appendChild(card);
          });
        })
        .catch(error => {
          document.getElementById('newsContent').textContent =
            `뉴스를 불러오지 못했습니다: ${error.message}`;
        });
    }

    document.getElementById('syncButton').addEventListener('click', syncToss);
    document.getElementById('saveButton').addEventListener('click', saveSnapshot);
    document.getElementById('reloadButton').addEventListener('click', loadHistory);
    document.getElementById('filterButton').addEventListener('click', renderHistory);
    document.getElementById('closeNews').addEventListener('click', () => {
      const modal = document.getElementById('newsModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    });

    document.querySelectorAll('.tab').forEach(button => {
      button.addEventListener('click', () => {
        const isHistory = button.dataset.tab === 'history';
        document.getElementById('portfolioView').classList.toggle('hidden', isHistory);
        document.getElementById('historyView').classList.toggle('hidden', !isHistory);

        document.querySelectorAll('.tab').forEach(tab => {
          tab.classList.toggle('text-emerald-400', tab === button);
          tab.classList.toggle('text-slate-400', tab !== button);
        });

        if (isHistory) loadHistory();
      });
    });

    loadFxRate();
  </script>
</body>
</html>
